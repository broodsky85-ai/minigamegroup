<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여명의 서약 — 만 번의 검</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0b0d14; --bg2: #121622; --panel: #1a1f30; --panel2: #232a40;
    --border: #3a4463; --text: #e8e4d8; --muted: #9aa3bd;
    --gold: #d8b45a; --gold2: #f0d489;
    --ally: #6fb0f0; --foe: #e0616a; --npc: #7ddc9a; --danger: #e0616a;
  }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Pretendard, "Malgun Gothic", Arial, sans-serif;
    line-height: 1.65; word-break: keep-all; -webkit-tap-highlight-color: transparent;
  }
  .screen { display: none; }
  .screen.on { display: block; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; border-radius: 4px; font-weight: 700;
    font-size: clamp(14px, 3.4vw, 15px); cursor: pointer;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    font-family: inherit; text-decoration: none; transition: filter .12s, transform .08s;
  }
  .btn:hover { filter: brightness(1.18); }
  .btn:active { transform: translateY(1px); }
  .btn.gold { background: linear-gradient(180deg, #d8b45a, #a8842f); border-color: #e8ca86; color: #1a1305; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .4; cursor: default; filter: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  #title .wrap { padding-top: 48px; text-align: center; }
  .crest { font-size: 44px; line-height: 1; margin-bottom: 6px; }
  h1 {
    font-size: clamp(28px, 7.6vw, 44px); margin: 0 0 6px;
    letter-spacing: .16em; color: var(--gold2); text-shadow: 0 0 22px rgba(216,180,90,.28);
  }
  .sub { color: var(--muted); letter-spacing: .3em; font-size: clamp(11px, 3vw, 13px); margin-bottom: 24px; }
  .prologue {
    max-width: 470px; margin: 0 auto 28px; color: var(--muted);
    font-size: clamp(13px, 3.4vw, 15px); text-align: left;
    border-left: 2px solid var(--border); padding: 4px 0 4px 16px;
  }
  .prologue p { margin: 0 0 6px; }
  #saveNote { margin-top: 20px; color: var(--muted); font-size: 13px; min-height: 20px; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .head h2 { margin: 0; font-size: clamp(18px, 5vw, 24px); color: var(--gold2); letter-spacing: .08em; }
  .actlabel { margin: 22px 0 10px; color: var(--gold); font-size: 12px; letter-spacing: .18em; }
  .actlabel:first-child { margin-top: 0; }
  .chlist { display: grid; gap: 10px; }
  .chcard {
    display: flex; gap: 14px; align-items: center; text-align: left;
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold);
    border-radius: 4px; padding: 14px 16px; cursor: pointer; color: inherit;
    font-family: inherit; width: 100%; transition: transform .12s, border-color .12s;
  }
  .chcard:hover:not(.locked) { transform: translateX(3px); border-color: var(--gold2); }
  .chcard.locked { opacity: .42; cursor: default; border-left-color: var(--border); }
  .chcard.done { border-left-color: var(--npc); }
  .chnum { font-size: 24px; font-weight: 800; color: var(--gold); min-width: 34px; text-align: center; }
  .chcard.locked .chnum { color: var(--muted); }
  .chbody h3 { margin: 0 0 2px; font-size: clamp(14px, 3.9vw, 16px); }
  .chbody p { margin: 0; color: var(--muted); font-size: clamp(12px, 3.2vw, 13px); }

  .party { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 6px; }
  .pcard {
    display: flex; gap: 10px; align-items: center; background: var(--panel);
    border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px 8px 8px; flex: 1 1 200px;
  }
  .pcard canvas { image-rendering: pixelated; width: 40px; height: 40px; flex: none; }
  .pcard .pn { font-size: 13px; font-weight: 700; }
  .pcard .pl { font-size: 11px; color: var(--muted); }

  #bar {
    position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: rgba(11,13,20,.94); border-bottom: 1px solid var(--border);
    font-size: clamp(11px, 3vw, 13px); flex-wrap: wrap;
  }
  #bar .t { color: var(--gold2); font-weight: 800; letter-spacing: .06em; }
  #bar .obj { color: var(--muted); flex: 1 1 100%; order: 3; }
  #phaseTag { padding: 2px 9px; border-radius: 3px; font-weight: 800; font-size: 11px; }
  #phaseTag.ally { background: #1d3a5c; color: #9dcbf7; }
  #phaseTag.foe { background: #4a1e24; color: #f2a2a8; }

  #stage { position: relative; width: 100%; max-width: 672px; margin: 10px auto 0; }
  #map { display: block; width: 100%; height: auto; image-rendering: pixelated;
         border: 2px solid var(--border); border-radius: 3px; background: #0d1017; touch-action: manipulation; }
  .pop {
    position: absolute; transform: translate(-50%, -50%); pointer-events: none;
    font-weight: 900; font-size: 17px; text-shadow: 0 2px 0 #000, 0 0 6px #000;
    animation: rise .85s ease-out forwards;
  }
  @keyframes rise { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%); } }

  #panels { max-width: 672px; margin: 10px auto 0; display: grid; gap: 10px; }
  .pane { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; }
  .pane h4 { margin: 0 0 8px; font-size: 12px; color: var(--gold); letter-spacing: .12em; }

  .uinfo { display: flex; gap: 12px; align-items: flex-start; }
  .uinfo canvas { image-rendering: pixelated; width: 48px; height: 48px; flex: none; }
  .uinfo .nm { font-weight: 800; font-size: 15px; }
  .uinfo .cl { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .hpbar { height: 8px; background: #2a2f45; border-radius: 2px; overflow: hidden; margin: 4px 0 6px; }
  .hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #5ec97a, #8fe6a4); transition: width .25s; }
  .hpbar.low i { background: linear-gradient(90deg, #d8b45a, #f0d489); }
  .hpbar.crit i { background: linear-gradient(90deg, #c0424c, #e0616a); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 700; }
  .tagline { margin-top: 6px; font-size: 11px; color: var(--danger); font-weight: 700; letter-spacing: .06em; }

  #actMenu { display: none; gap: 8px; flex-wrap: wrap; }
  #actMenu.on { display: flex; }
  #fcast { display: none; }
  #fcast.on { display: block; }
  .fc { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .fc .side { flex: 1; }
  .fc .side.r { text-align: right; }
  .fc .vs { color: var(--gold); font-weight: 800; }
  .fc .nm { font-weight: 700; font-size: 13px; }
  .fc .dm { font-size: 12px; color: var(--muted); }
  .fc .dm b { color: var(--danger); }
  .mercy { margin-top: 6px; padding: 5px 9px; border-radius: 3px; background: #3a121a;
           border: 1px solid #7a2430; color: #f2a2a8; font-size: 11px; font-weight: 700; }

  #log { max-height: 108px; overflow-y: auto; font-size: 12px; color: var(--muted); }
  #log div { padding: 1px 0; }
  #log div:last-child { color: var(--text); }

  #talk {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(6,8,13,.82); backdrop-filter: blur(3px);
    align-items: flex-end; justify-content: center; padding: 16px;
  }
  #talk.on { display: flex; }
  #talkBox {
    width: 100%; max-width: 680px; background: linear-gradient(180deg, #171c2b, #0f1320);
    border: 2px solid var(--border); border-radius: 4px; padding: 14px 16px 16px;
    box-shadow: 0 -10px 40px rgba(0,0,0,.6);
  }
  #talkTop { display: flex; gap: 14px; align-items: flex-start; }
  #talkFace { image-rendering: pixelated; width: 64px; height: 64px; flex: none;
              border: 1px solid var(--border); background: #0d1017; }
  #talkFace.hide { display: none; }
  #talkName { color: var(--gold2); font-weight: 800; font-size: 14px; letter-spacing: .06em; min-height: 20px; }
  #talkText { font-size: clamp(14px, 3.7vw, 16px); min-height: 3.3em; }
  #talkText.narr { color: var(--muted); font-style: italic; }
  #talkHint { text-align: right; color: var(--muted); font-size: 11px; height: 14px; }
  #talkChoices { display: none; gap: 8px; margin-top: 10px; }
  #talkChoices.on { display: grid; }
  #talkChoices .q { color: var(--gold); font-size: 13px; margin-bottom: 2px; }
  .copt {
    text-align: left; padding: 11px 14px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    font-family: inherit; font-size: clamp(13px, 3.4vw, 15px); line-height: 1.5;
  }
  .copt:hover { border-color: var(--gold); background: #2b3350; }
  .copt small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }

  .verdict { text-align: center; padding: 26px 0 10px; }
  .verdict .big { font-size: clamp(26px, 7vw, 36px); font-weight: 900; letter-spacing: .12em; margin-bottom: 4px; }
  .verdict .big.win { color: var(--gold2); text-shadow: 0 0 24px rgba(216,180,90,.3); }
  .verdict .big.lose { color: var(--danger); }
  .verdict p { color: var(--muted); margin: 0; }
  .memo { display: grid; gap: 10px; }
  .memo .mi { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold);
              border-radius: 3px; padding: 12px 14px; font-size: 13px; }
  .memo .mi.locked { border-left-color: var(--border); color: var(--muted); opacity: .55; }
  .memo .mi h5 { margin: 0 0 4px; font-size: 13px; color: var(--gold2); }
  .memo .mi p { margin: 0 0 4px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border-radius: 3px; border: 1px solid var(--border); background: transparent;
         color: var(--muted); cursor: pointer; font-family: inherit; font-size: 13px; }
  .tab.on { background: var(--panel2); color: var(--gold2); border-color: var(--gold); }
  .tpane { display: none; }
  .tpane.on { display: block; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 22px 16px 30px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<div id="title" class="screen on">
  <div class="wrap">
    <div class="crest">⚔️</div>
    <h1>여명의 서약</h1>
    <div class="sub">만 번의 검</div>
    <div class="prologue">
      <p>북방의 하늘이 검게 물든 지 서른 해.</p>
      <p>세 번의 원정이 있었고, 세 번 모두 돌아온 자가 없었다.</p>
      <p>네 번째는 재능 없는 소년 하나로 시작한다.</p>
      <p>그 소년이 가진 것은 만 번 휘두른 검과, 아무 쓸모 없는 얼굴뿐이었다.</p>
    </div>
    <div class="row">
      <button class="btn gold" id="btnNew">새로 시작</button>
      <button class="btn" id="btnCont">이어하기</button>
      <button class="btn ghost" id="btnMemo">회상록</button>
    </div>
    <div id="saveNote"></div>
  </div>
  <footer>바닐라 HTML · CSS · JS · <a href="index.html">미니게임 모음으로</a></footer>
</div>

<div id="chapters" class="screen">
  <div class="wrap">
    <div class="head">
      <h2>원정의 기록</h2>
      <button class="btn ghost" id="btnToTitle">타이틀</button>
    </div>
    <div id="chlist"></div>
    <div class="actlabel">일행</div>
    <div class="party" id="party"></div>
  </div>
</div>

<div id="battle" class="screen">
  <div id="bar">
    <span class="t" id="barTitle">1장</span>
    <span id="phaseTag" class="ally">아군 페이즈</span>
    <span style="color:var(--muted)" id="turnLabel">1턴</span>
    <span style="flex:1"></span>
    <button class="btn" id="btnEnd" style="padding:6px 14px;font-size:12px">턴 종료</button>
    <button class="btn ghost" id="btnGiveUp" style="padding:6px 12px;font-size:12px">후퇴</button>
    <span class="obj" id="objLabel"></span>
  </div>

  <div id="stage"><canvas id="map" width="672" height="480"></canvas></div>

  <div id="panels">
    <div class="pane">
      <div class="uinfo">
        <canvas id="uface" width="64" height="64"></canvas>
        <div style="flex:1;min-width:0">
          <div class="nm" id="uName">칸을 눌러 유닛을 고르세요</div>
          <div class="cl" id="uClass">아군을 고르면 이동할 수 있는 칸이 파랗게 표시됩니다.</div>
          <div class="hpbar" id="uHpBar"><i style="width:0"></i></div>
          <div class="stats" id="uStats"></div>
          <div class="tagline" id="uTag" style="display:none"></div>
        </div>
      </div>
      <div id="actMenu" style="margin-top:10px"></div>
      <div id="fcast" style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px"></div>
    </div>
    <div class="pane">
      <h4>전황</h4>
      <div id="log"></div>
    </div>
  </div>
</div>

<div id="result" class="screen">
  <div class="wrap">
    <div class="verdict">
      <div class="big" id="rTitle"></div>
      <p id="rSub"></p>
    </div>
    <div id="rBody" class="memo" style="margin:20px 0"></div>
    <div class="row"><button class="btn gold" id="btnNext">계속</button></div>
  </div>
</div>

<div id="memoir" class="screen">
  <div class="wrap">
    <div class="head">
      <h2>회상록</h2>
      <button class="btn ghost" id="btnMemoBack">돌아가기</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-t="ep">그 뒤의 이야기</button>
      <button class="tab" data-t="sp">일행의 대화</button>
    </div>
    <div class="tpane on" id="tpEp"><div class="memo" id="epList"></div></div>
    <div class="tpane" id="tpSp"><div class="memo" id="spList"></div></div>
  </div>
</div>

<div id="talk">
  <div id="talkBox">
    <div id="talkTop">
      <canvas id="talkFace" width="64" height="64"></canvas>
      <div style="flex:1;min-width:0">
        <div id="talkName"></div>
        <div id="talkText"></div>
      </div>
    </div>
    <div id="talkChoices"></div>
    <div id="talkHint">▼ 클릭</div>
  </div>
</div>

const SAVE_KEY = "hero-oath-v1";
const BLANK = { v: 2, cleared: 0, flags: [], roster: {}, supports: [], epilogues: [], effects: [], cleared_run: false };

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(BLANK));
    const s = JSON.parse(raw);
    if (s.v !== BLANK.v) return JSON.parse(JSON.stringify(BLANK));
    return Object.assign(JSON.parse(JSON.stringify(BLANK)), s);
  } catch (e) { return JSON.parse(JSON.stringify(BLANK)); }
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
let SAVE = loadSave();

  const g = lv - 1;
  const u = {
    uid: spec.id + "@" + spec.x + "," + spec.y + ":" + Math.random().toString(36).slice(2, 7),
    id: spec.id, side, name: spec.name || c.name, cls: c.cls, clsName: cl.n,
    pal: c.pal, spr: cl.spr, wpn: cl.wpn, kind: cl.kind, healer: !!cl.healer,
    human: !!cl.human, evil: !!spec.evil,
    mov: cl.mov, rng: cl.rng, lv,
    maxhp: cl.base.hp + cl.grow.hp * g,
    atk: cl.base.atk + cl.grow.atk * g,
    def: cl.base.def + cl.grow.def * g,
    mag: cl.base.mag + cl.grow.mag * g,
    res: cl.base.res + cl.grow.res * g,
    exp: isParty && saved ? saved.exp : 0,
    x: spec.x, y: spec.y, alive: true, acted: false, boss: !!spec.boss,
    retreat: spec.retreat || 0, skip: spec.skip || 0,
    hold: side === "foe" ? (spec.hold !== undefined ? spec.hold : true) : false
  };
  if (isParty && saved && saved.bonus) {
    u.maxhp += saved.bonus.hp || 0; u.mag += saved.bonus.mag || 0;
    u.atk += saved.bonus.atk || 0; u.def += saved.bonus.def || 0;
  }
  u.hp = u.maxhp;
  return u;
}

function startChapter(idx) {
  const ch = CHAPTERS[idx];
  G.ch = ch; G.chIdx = idx;
  G.grid = ch.map.map(r => r.split(""));
  G.units = []; G.turn = 1; G.side = "ally"; G.sel = null; G.moveSet = null;
  G.atkSet = null; G.pending = null; G.over = false; G.busy = false; G.buff = 0;
  G.log = []; G.fired = new Set(); G.preMove = null; G.evilKilled = 0;

  ch.allies.forEach(a => { if (JOIN_AT[a.id] === undefined || JOIN_AT[a.id] <= idx) G.units.push(makeUnit(a, "ally")); });
  (ch.npcs || []).forEach(a => { const u = makeUnit(a, "npc"); u.joinTurn = a.joinTurn; G.units.push(u); });
  ch.foes.forEach(f => G.units.push(makeUnit(f, "foe")));
  if (ch.extraFoe && G.flags.has(ch.extraFoe.flag)) G.units.push(makeUnit(ch.extraFoe.unit, "foe"));

  show("battle");
  $("barTitle").textContent = ch.id + "장 " + ch.title;
  $("objLabel").textContent = "목표 · " + ch.obj;
  pushLog(ch.id + "장 「" + ch.title + "」 — " + ch.sub);
  refresh();
  talk(ch.intro, () => { applyIntroEffects(); beginPlayerTurn(); });
}

/* 선택지가 남긴 플래그를 전투 수치에 반영한다 */
function applyIntroEffects() {
  if (G.flags.has("struck_first") && G.chIdx === 0) G.buff = 3;
  if (G.flags.has("no_words")) G.buff = 3;
  if (G.flags.has("heard_offer")) {
    const b = G.units.find(u => u.boss && u.side === "foe");
    if (b) b.skip = 1;
  }
  /* 도입부 선택이 적을 늘리는 경우 (예: 6장 좌익 구원) */
  (G.ch.extraFoes || []).forEach(e => {
    if (G.flags.has(e.flag) && !unitAt(e.unit.x, e.unit.y)) G.units.push(makeUnit(e.unit, "foe"));
  });
  refresh();
}

/* =========================================================================
   9. 이동 범위 / 사거리
   ========================================================================= */

function movable(u) {
  const cost = new Map(); cost.set(key(u.x, u.y), 0);
  const q = [{ x: u.x, y: u.y, c: 0 }];
  while (q.length) {
    q.sort((a, b) => a.c - b.c);
    const cur = q.shift();
    if (cur.c > (cost.get(key(cur.x, cur.y)) ?? 99)) continue;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(d => {
      const nx = cur.x + d[0], ny = cur.y + d[1];
      if (!inBounds(nx, ny)) return;
      const t = T_(tileAt(nx, ny));
      if (t.block) return;
      const blocker = unitAt(nx, ny);
      if (blocker && blocker.side !== u.side) return;   // 적은 통과 못 한다
      const nc = cur.c + t.cost;
      if (nc > u.mov) return;
      if (nc < (cost.get(key(nx, ny)) ?? 99)) { cost.set(key(nx, ny), nc); q.push({ x: nx, y: ny, c: nc }); }
    });
  }
  const out = new Set();
  cost.forEach((c, k) => {
    const o = unitAt(k % W, (k / W) | 0);
    if (!o || o === u) out.add(k);
  });
  return out;
}

function rangeFrom(x, y, rng) {
  const s = new Set();
  for (let dy = -rng; dy <= rng; dy++) for (let dx = -rng; dx <= rng; dx++) {
    const d = Math.abs(dx) + Math.abs(dy);
    if (d === 0 || d > rng) continue;
    if (inBounds(x + dx, y + dy)) s.add(key(x + dx, y + dy));
  }
  return s;
}

function threatSet(u, moves) {
  const s = new Set();
  moves.forEach(k => rangeFrom(k % W, (k / W) | 0, u.rng).forEach(v => s.add(v)));
  return s;
}

/* =========================================================================
   10. 전투 계산 — 「자비 없음」이 여기 들어 있다
   ========================================================================= */

function tri(a, d) {
  if (BEATS[a.wpn] === d.wpn) return 1;
  if (BEATS[d.wpn] === a.wpn) return -1;
  return 0;
}
function mercy(a, d) { return a.id === "arden" && d.human && d.evil; }
function power(u) {
  let p = u.kind === "mag" ? u.mag : u.atk;
  if (u.side === "ally" && G.turn === 1) p += G.buff;
  return p;
}
function forecast(a, d) {
  const t = T_(tileAt(d.x, d.y));
  const guard = a.kind === "mag" ? d.res : d.def + t.def;
  const adv = tri(a, d);
  const m = mercy(a, d);
  let dmg = Math.max(1, power(a) + adv * 2 - guard);
  if (m) dmg = Math.floor(dmg * MERCY_MULT);
  const hit = Math.max(35, Math.min(99, 92 + adv * 12 - t.avo + (m ? 8 : 0)));
  return { dmg, hit, crit: a.boss ? 12 : 8, mercy: m };
}
function canCounter(a, d) {
  if (!d.alive || d.healer) return false;
  if (mercy(a, d)) return false;            // 자비 없음 — 반격할 틈이 없다
  return manhattan(a, d) <= d.rng;
}

/* =========================================================================
   11. 연출
   ========================================================================= */

function pop(x, y, text, color) {
  const st = $("stage"); if (!st) return;
  const el = document.createElement("div");
  el.className = "pop"; el.textContent = text; el.style.color = color || "#fff";
  el.style.left = ((x * TS + TS / 2) / (W * TS) * 100) + "%";
  el.style.top = ((y * TS + 2) / (H * TS) * 100) + "%";
  st.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 880);
}
function pushLog(s) {
  G.log.push(s); if (G.log.length > 40) G.log.shift();
  const l = $("log"); if (!l) return;
  l.innerHTML = G.log.map(x => "<div>" + x + "</div>").join("");
  l.scrollTop = l.scrollHeight;
}

/* =========================================================================
   12. 행동
   ========================================================================= */

function strike(a, d) {
  const f = forecast(a, d);
  if (Math.random() * 100 >= f.hit) {
    pop(d.x, d.y, "빗나감", "#9aa3bd"); pushLog(a.name + "의 공격 — 빗나갔다.");
    return 0;
  }
  const isCrit = Math.random() * 100 < f.crit;
  const dmg = isCrit ? Math.floor(f.dmg * 1.5) : f.dmg;
  d.hp = Math.max(0, d.hp - dmg);
  pop(d.x, d.y, (f.mercy ? "무자비 " : isCrit ? "회심! " : "") + dmg, f.mercy ? "#ff5560" : isCrit ? "#f0d489" : "#ff8a90");
  pushLog(a.name + " → " + d.name + " " + dmg + " 피해" +
    (f.mercy ? " · 자비 없음" : isCrit ? " (회심의 일격)" : "") + ".");
  if (a.side === "ally") gainExp(a, isCrit ? 14 : 10);
  if (d.hp === 0) fall(d, a);
  return dmg;
}

function fall(u, killer) {
  u.alive = false;
  pushLog(u.name + " 쓰러짐.");
  pop(u.x, u.y, "✖", "#e0616a");
  if (u.side === "ally" || u.side === "npc") G.fell.add(u.id);
  if (u.evil && killer && killer.id === "arden") G.evilKilled++;
  if (killer && killer.side === "ally") gainExp(killer, u.boss ? 60 : 32);
}

function gainExp(u, n) {
  if (PARTY_ORDER.indexOf(u.id) < 0) return;
  u.exp += n;
  while (u.exp >= 100 && u.lv < 20) {
    u.exp -= 100; u.lv++;
    const g = CLASSES[u.cls].grow;
    u.maxhp += g.hp; u.hp += g.hp; u.atk += g.atk; u.def += g.def; u.mag += g.mag; u.res += g.res;
    pop(u.x, u.y, "LV " + u.lv, "#8fe6a4");
    pushLog(u.name + " 레벨 " + u.lv + ".");
  }
}

function heal(a, t) {
  const real = Math.min(8 + Math.floor(a.mag / 2), t.maxhp - t.hp);
  t.hp += real;
  pop(t.x, t.y, "+" + real, "#8fe6a4");
  pushLog(a.name + "이(가) " + t.name + "을(를) " + real + " 회복.");
  if (a.side === "ally") gainExp(a, 12 + real);
}

function finishAct(u) {
  u.acted = true;
  G.sel = null; G.moveSet = null; G.atkSet = null; G.pending = null; G.preMove = null;
  const t = T_(tileAt(u.x, u.y));
  if (t.heal && u.hp < u.maxhp && u.side !== "foe") {
    const r = Math.min(t.heal, u.maxhp - u.hp); u.hp += r; pop(u.x, u.y, "+" + r, "#8fe6a4");
  }
  checkSupports(u);
  refresh();
  runTriggers();
  if (G.over) return;
  checkEnd();
  if (!G.over && G.side === "ally" && G.units.every(a => a.side !== "ally" || !a.alive || a.acted)) {
    setTimeout(endTurn, 340);
  }
}

/* =========================================================================
   13. 조작
   ========================================================================= */

function selectUnit(u) {
  G.sel = u; G.pending = null;
  if (u.side === "ally" && !u.acted && G.side === "ally" && !G.busy) {
    G.preMove = { x: u.x, y: u.y };
    G.moveSet = movable(u);
    G.atkSet = threatSet(u, G.moveSet);
  } else {
    G.preMove = null; G.moveSet = null;
    G.atkSet = u.side === "foe" ? threatSet(u, movable(u)) : null;
  }
  refresh();
}

function resolveAttack(actor, target) {
  G.busy = true;
  strike(actor, target);
  refresh();
  setTimeout(() => {
    if (target.alive && canCounter(actor, target)) { strike(target, actor); refresh(); }
    setTimeout(() => { G.busy = false; finishAct(actor); }, 260);
  }, 320);
}

function onTile(x, y) {
  if (G.busy || G.over || TALK.open) return;
  const u = unitAt(x, y);

  if (G.pending) {
    if (u && G.pending.targets.indexOf(u) >= 0) {
      const p = G.pending;
      if (p.mode === "attack") resolveAttack(p.actor, u);
      else { G.busy = true; heal(p.actor, u); refresh(); setTimeout(() => { G.busy = false; finishAct(p.actor); }, 300); }
      return;
    }
    G.pending = null; refresh(); return;
  }

  // 이동
  if (G.sel && G.moveSet && G.moveSet.has(key(x, y)) && !G.sel.acted && G.sel.side === "ally") {
    G.sel.x = x; G.sel.y = y;
    G.moveSet = null; G.atkSet = null;
    refresh();
    return;
  }

  // 이동을 마친 아군 옆의 적을 바로 누르면 공격
  if (u && u.side === "foe" && G.sel && G.sel.side === "ally" && !G.sel.acted &&
      G.side === "ally" && !G.moveSet && manhattan(G.sel, u) <= G.sel.rng) {
    resolveAttack(G.sel, u); return;
  }

  if (u) { selectUnit(u); return; }
  G.sel = null; G.moveSet = null; G.atkSet = null; G.preMove = null; refresh();
}

function actTargets(u, mode) {
  const r = rangeFrom(u.x, u.y, u.rng);
  return G.units.filter(o => o.alive && r.has(key(o.x, o.y)) &&
    (mode === "attack" ? o.side === "foe" : (o.side !== "foe" && o.hp < o.maxhp)));
}

function renderActMenu() {
  const m = $("actMenu"); if (!m) return;
  m.innerHTML = ""; m.classList.remove("on");
  const u = G.sel;
  if (!u || u.side !== "ally" || u.acted || G.side !== "ally" || G.busy || G.over) return;
  m.classList.add("on");

  const foes = actTargets(u, "attack");
  const b1 = document.createElement("button");
  b1.className = "btn"; b1.id = "actAttack";
  b1.textContent = "공격 (" + foes.length + ")";
  b1.disabled = foes.length === 0;
  b1.onclick = () => { G.pending = { actor: u, mode: "attack", targets: foes }; refresh(); };
  m.appendChild(b1);

  if (u.healer) {
    const hs = actTargets(u, "heal");
    const b2 = document.createElement("button");
    b2.className = "btn"; b2.id = "actHeal";
    b2.textContent = "치유 (" + hs.length + ")";
    b2.disabled = hs.length === 0;
    b2.onclick = () => { G.pending = { actor: u, mode: "heal", targets: hs }; refresh(); };
    m.appendChild(b2);
  }

  const b3 = document.createElement("button");
  b3.className = "btn ghost"; b3.id = "actWait"; b3.textContent = "대기";
  b3.onclick = () => finishAct(u);
  m.appendChild(b3);

  if (!G.moveSet && G.preMove && (G.preMove.x !== u.x || G.preMove.y !== u.y)) {
    const b5 = document.createElement("button");
    b5.className = "btn ghost"; b5.id = "actUndo"; b5.textContent = "이동 취소";
    b5.onclick = () => { u.x = G.preMove.x; u.y = G.preMove.y; selectUnit(u); };
    m.appendChild(b5);
  }
  if (G.pending) {
    const b4 = document.createElement("button");
    b4.className = "btn ghost"; b4.textContent = "취소";
    b4.onclick = () => { G.pending = null; refresh(); };
    m.appendChild(b4);
  }
}

function renderForecast() {
  const f = $("fcast"); if (!f) return;
  f.classList.remove("on"); f.innerHTML = "";
  if (!G.pending || G.pending.mode !== "attack" || !G.pending.targets.length) return;
  const a = G.pending.actor, d = G.pending.targets[0];
  const mine = forecast(a, d);
  const back = canCounter(a, d) ? forecast(d, a) : null;
  f.classList.add("on");
  f.innerHTML =
    '<div class="fc"><div class="side"><div class="nm">' + a.name + '</div>' +
    '<div class="dm">위력 <b>' + mine.dmg + '</b> · 명중 ' + mine.hit + '% · 회심 ' + mine.crit + '%</div></div>' +
    '<div class="vs">▶</div>' +
    '<div class="side r"><div class="nm">' + d.name + '</div>' +
    '<div class="dm">' + (back ? "반격 <b>" + back.dmg + "</b> · 명중 " + back.hit + "%" : "반격 없음") + '</div></div></div>' +
    (mine.mercy ? '<div class="mercy" id="mercyTag">「자비 없음」 위력 1.5배 · 반격을 받지 않는다</div>' : "") +
    '<div style="color:var(--muted);font-size:11px;margin-top:6px">붉게 표시된 적을 눌러 공격합니다.</div>';
}

/* =========================================================================
   14. 턴
   ========================================================================= */

function beginPlayerTurn() {
  G.side = "ally";
  G.units.forEach(u => { if (u.side !== "foe") u.acted = false; });
  if (G.turn > 1) G.buff = 0;
  refresh();
  runTriggers();
  checkEnd();
}

function endTurn() {
  if (G.over || G.busy) return;
  if (TALK.open) { setTimeout(endTurn, 200); return; }
  G.sel = null; G.moveSet = null; G.atkSet = null; G.pending = null; G.preMove = null;
  G.side = "foe";
  G.units.forEach(u => { if (u.side === "foe") u.acted = false; });
  refresh();
  setTimeout(enemyStep, 380);
}

function enemyStep() {
  if (G.over) return;
  if (TALK.open) { setTimeout(enemyStep, 200); return; }
  const next = G.units.find(u => u.alive && u.side === "foe" && !u.acted);
  if (!next) { G.turn++; beginPlayerTurn(); return; }
  aiAct(next);
  refresh();
  runTriggers();
  checkEnd();
  if (G.over) return;
  setTimeout(enemyStep, 260);
}

/* AI — 닿을 수 있는 자리 중 가장 이득이 큰 곳으로 간다 */
function aiAct(u) {
  u.acted = true;
  if (u.skip > 0) { u.skip--; return; }
  const marks = G.units.filter(o => o.alive && o.side === "ally");
  if (!marks.length) return;

  const moves = movable(u);
  moves.add(key(u.x, u.y));

  if (u.hold) {
    if (!marks.some(m => manhattan(u, m) <= u.mov + u.rng + 1)) return;
    u.hold = false;
  }

  let best = null;
  moves.forEach(k => {
    const x = k % W, y = (k / W) | 0;
    const occ = unitAt(x, y);
    if (occ && occ !== u) return;
    const t = T_(tileAt(x, y));
    marks.forEach(m => {
      if (Math.abs(x - m.x) + Math.abs(y - m.y) > u.rng) return;
      const sx = u.x, sy = u.y;
      u.x = x; u.y = y;
      const f = forecast(u, m);
      const expect = Math.min(f.dmg, m.hp) * (f.hit / 100);
      const back = canCounter(u, m) ? forecast(m, u) : null;
      const risk = back ? Math.min(back.dmg, u.hp) * (back.hit / 100) : 0;
      u.x = sx; u.y = sy;
      let score = expect * 2 - risk + t.def * 1.5;
      if (f.dmg >= m.hp && f.hit >= 60) score += 60;
      if (m.id === "arden") score += 8;
      if (!best || score > best.score) best = { score, x, y, target: m };
    });
  });

  if (best && best.score > 0) {
    u.x = best.x; u.y = best.y;
    const d = best.target;
    strike(u, d);
    if (d.alive && canCounter(u, d)) strike(d, u);
    return;
  }

  let goal = marks[0];
  marks.forEach(m => { if (manhattan(u, m) < manhattan(u, goal)) goal = m; });
  let pick = { x: u.x, y: u.y, d: manhattan(u, goal) };
  moves.forEach(k => {
    const x = k % W, y = (k / W) | 0;
    const occ = unitAt(x, y);
    if (occ && occ !== u) return;
    const d = Math.abs(x - goal.x) + Math.abs(y - goal.y);
    if (d < pick.d) pick = { x, y, d };
  });
  u.x = pick.x; u.y = pick.y;
}

/* =========================================================================
   15. 사건 — 트리거, 지원 대화, 승패
   ========================================================================= */

function boss() { return G.units.find(u => u.side === "foe" && u.boss) || null; }

function runTriggers() {
  if (G.over || TALK.open) return;
  const ch = G.ch; if (!ch || !ch.triggers) return;
  for (let i = 0; i < ch.triggers.length; i++) {
    const tr = ch.triggers[i], tag = "tr" + i;
    if (tr.once !== false && G.fired.has(tag)) continue;
    let hit = false;
    if (tr.turn && G.turn >= tr.turn && G.side === "ally") hit = true;
    if (tr.evilKill && G.evilKilled > 0) hit = true;
    if (tr.foeHp === "boss") { const b = boss(); if (b && b.alive && b.hp / b.maxhp <= tr.below) hit = true; }
    if (!hit) continue;
    G.fired.add(tag);
    if (tr.join) {
      const u = G.units.find(a => a.id === tr.join && a.side === "npc");
      if (u) { u.side = "ally"; u.acted = false; pushLog(u.name + " 합류."); }
    }
    if (tr.summon && ch.summons) {
      ch.summons.forEach(s => { if (!unitAt(s.x, s.y)) G.units.push(makeUnit(s, "foe")); });
      pushLog("증원이 나타났다.");
    }
    refresh();
    talk(tr.lines, () => { refresh(); checkEnd(); });
    return;
  }
}

function checkSupports(u) {
  if (u.side !== "ally") return;
  const nbrs = G.units.filter(o => o.alive && o.side === "ally" && o !== u && manhattan(o, u) === 1);
  for (const o of nbrs) {
    const s = SUPPORTS.find(sp =>
      sp.ch <= G.ch.id && SAVE.supports.indexOf(sp.key) < 0 &&
      ((sp.a === u.id && sp.b === o.id) || (sp.b === u.id && sp.a === o.id)));
    if (s) {
      SAVE.supports.push(s.key); writeSave();
      pushLog("일행의 대화 — 「" + s.title + "」");
      talk(s.lines, () => refresh());
      return;
    }
  }
}

function checkEnd() {
  if (G.over || TALK.open) return;
  const ch = G.ch;
  const arden = G.units.find(u => u.id === "arden");
  if (arden && !arden.alive) return lose("아르덴이 쓰러졌다.");
  if (ch.lose && ch.lose.protect) {
    const p = G.units.find(u => u.id === ch.lose.protect);
    if (p && !p.alive) return lose(CAST[ch.lose.protect].name + "을(를) 지키지 못했다.");
  }
  if (!G.units.some(u => u.alive && u.side === "ally")) return lose("일행이 전멸했다.");

  const b = boss();
  if (b && b.alive && b.retreat && b.hp / b.maxhp <= b.retreat) {
    b.alive = false; G.over = true; refresh();
    talk(ch.retreatLines || [], () => win());
    return;
  }
  if (ch.win.type === "boss") { if (!b || !b.alive) return win(); }
  else if (ch.win.type === "survive") { if (G.turn > ch.win.turns) return win(); }
  else if (!G.units.some(u => u.alive && u.side === "foe")) return win();
}

function win() {
  G.over = true;
  G.units.filter(u => u.side === "ally" && PARTY_ORDER.indexOf(u.id) >= 0).forEach(u => {
    const prev = G.roster[u.id];
    G.roster[u.id] = { lv: u.lv, exp: u.exp, bonus: (prev && prev.bonus) || null };
  });
  talk(G.ch.outro, () => afterChapter());
}

function lose(why) { G.over = true; showResult(false, why); }

/* 아웃트로의 선택이 남긴 보상. 같은 장을 다시 깨도 한 번만 붙는다. */
function applyOutroEffects() {
  const bump = (id, k, v) => {
    G.roster[id] = G.roster[id] || { lv: 1, exp: 0, bonus: null };
    G.roster[id].bonus = G.roster[id].bonus || { hp: 0, mag: 0, atk: 0, def: 0 };
    G.roster[id].bonus[k] += v;
  };
  const once = (tag, fn) => {
    if (SAVE.effects.indexOf(tag) >= 0) return;
    SAVE.effects.push(tag); fn();
  };
  if (G.flags.has("book_burned")) once("book_burned", () => PARTY_ORDER.forEach(p => bump(p, "hp", 3)));
  if (G.flags.has("book_kept")) once("book_kept", () => bump("rien", "mag", 3));
  if (G.flags.has("took_half")) once("took_half", () => PARTY_ORDER.forEach(p => bump(p, "atk", 1)));
  if (G.flags.has("tended_wounded")) once("tended_wounded", () => PARTY_ORDER.forEach(p => bump(p, "hp", 2)));
}

function afterChapter() {
  applyOutroEffects();
  SAVE.cleared = Math.max(SAVE.cleared, G.chIdx + 1);
  SAVE.flags = [...G.flags];
  SAVE.roster = G.roster;
  writeSave();
  if (G.chIdx === CHAPTERS.length - 1 && ENDING_LINES.length) { rollEnding(); return; }
  showResult(true, null);
}

function showResult(won, why) {
  show("result");
  $("rTitle").className = "big " + (won ? "win" : "lose");
  $("rTitle").textContent = won ? "승리" : "패배";
  $("rSub").textContent = won ? G.ch.id + "장 「" + G.ch.title + "」 종료" : why + " 다시 시도할 수 있다.";
  const body = $("rBody"); body.innerHTML = "";
  if (won) {
    G.units.filter(u => u.side === "ally").forEach(u => {
      const d = document.createElement("div");
      d.className = "mi";
      d.innerHTML = "<h5>" + u.name + " · Lv " + u.lv + "</h5><p>체력 " + u.hp + "/" + u.maxhp +
        " · 위력 " + (u.kind === "mag" ? u.mag : u.atk) + " · 방어 " + u.def + " · 저항 " + u.res + "</p>";
      body.appendChild(d);
    });
    if (G.evilKilled > 0) {
      const d = document.createElement("div"); d.className = "mi";
      d.innerHTML = "<h5>자비 없음</h5><p>아르덴이 사람의 탈을 쓴 자 " + G.evilKilled + "명을 베었다. 한 번도 말을 걸지 않았다.</p>";
      body.appendChild(d);
    }
  }
  $("btnNext").textContent = won ? (G.chIdx + 1 < CHAPTERS.length ? "다음 장으로" : "원정의 기록으로") : "다시 도전";
  $("btnNext").onclick = won ? () => openChapters() : () => startChapter(G.chIdx);
}

function rollEnding() {
  if (G.fell.size === 0) G.flags.add("everyone_home"); else G.flags.add("someone_fell");
  SAVE.flags = [...G.flags];
  const got = EPILOGUES.filter(e => G.flags.has(e.flag)).slice(0, 5);
  got.forEach(e => { if (SAVE.epilogues.indexOf(e.flag) < 0) SAVE.epilogues.push(e.flag); });
  SAVE.cleared_run = true;
  writeSave();
  talk(ENDING_LINES.concat(got.map(e => ({ n: e.t }))).concat(ENDING_CODA), () => {
    show("result");
    $("rTitle").className = "big win";
    $("rTitle").textContent = "여명";
    $("rSub").textContent = "원정은 끝났다. 남은 이야기는 회상록에 있다.";
    const body = $("rBody"); body.innerHTML = "";
    got.forEach(e => { const d = document.createElement("div"); d.className = "mi"; d.innerHTML = "<p>" + e.t + "</p>"; body.appendChild(d); });
    $("btnNext").textContent = "회상록 보기";
    $("btnNext").onclick = () => openMemoir("title");
  });
}

const TALK = { q: [], open: false, typing: false, full: "", i: 0, timer: null, done: null, choosing: false };
const TYPE_MS = 16;

function talk(lines, done) {
  if (!lines || !lines.length) { if (done) done(); return; }
  TALK.q = lines.slice(); TALK.done = done || null; TALK.open = true; TALK.choosing = false;
  $("talk").classList.add("on");
  nextLine();
}

function nextLine() {
  if (TALK.choosing) return;
  if (!TALK.q.length) { closeTalk(); return; }
  const ln = TALK.q.shift();
  if (ln.choice) { renderChoice(ln.choice); return; }
  const who = ln.w || null;
  const text = ln.t || ln.n || "";
  const fc = $("talkFace");
  if (who && CAST[who] && CAST[who].face) { fc.classList.remove("hide"); drawFace(fc, who); }
  else fc.classList.add("hide");
  $("talkName").textContent = who && CAST[who] ? CAST[who].name : "";
  $("talkName").style.color = who && CAST[who] ? CAST[who].color : "var(--muted)";
  const tt = $("talkText");
  tt.className = who ? "" : "narr";
  TALK.full = text; TALK.i = 0; tt.textContent = ""; TALK.typing = true;
  $("talkHint").textContent = "";
  clearInterval(TALK.timer);
  TALK.timer = setInterval(() => {
    TALK.i += 2;
    tt.textContent = TALK.full.slice(0, TALK.i);
    if (TALK.i >= TALK.full.length) finishType();
  }, TYPE_MS);
}

function finishType() {
  clearInterval(TALK.timer); TALK.timer = null; TALK.typing = false;
  $("talkText").textContent = TALK.full;
  $("talkHint").textContent = "▼ 클릭";
}

function renderChoice(c) {
  TALK.choosing = true;
  finishType();
  $("talkText").textContent = c.q;
  $("talkText").className = "narr";
  $("talkName").textContent = "";
  $("talkFace").classList.add("hide");
  $("talkHint").textContent = "";
  const box = $("talkChoices");
  box.className = "on"; box.innerHTML = "";
  const q = document.createElement("div"); q.className = "q"; q.textContent = "선택";
  box.appendChild(q);
  c.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "copt"; b.dataset.opt = i;
    b.innerHTML = o.label + (o.hint ? "<small>" + o.hint + "</small>" : "");
    b.onclick = () => pickChoice(c, i);
    box.appendChild(b);
  });
}

function pickChoice(c, i) {
  const o = c.opts[i]; if (!o) return;
  if (o.flag) {
    // 같은 물음의 다른 선택지 플래그는 지운다. 갈림길은 한쪽만 남아야 한다.
    c.opts.forEach(other => {
      if (other === o || !other.flag) return;
      G.flags.delete(other.flag);
      const j = SAVE.flags.indexOf(other.flag);
      if (j >= 0) SAVE.flags.splice(j, 1);
    });
    G.flags.add(o.flag);
    if (SAVE.flags.indexOf(o.flag) < 0) SAVE.flags.push(o.flag);
    writeSave();
  }
  $("talkChoices").className = ""; $("talkChoices").innerHTML = "";
  TALK.choosing = false;
  if (o.then && o.then.length) TALK.q = o.then.concat(TALK.q);
  nextLine();
}

function closeTalk() {
  clearInterval(TALK.timer); TALK.timer = null;
  TALK.open = false; TALK.typing = false; TALK.choosing = false;
  $("talk").classList.remove("on");
  $("talkChoices").className = ""; $("talkChoices").innerHTML = "";
  const d = TALK.done; TALK.done = null;
  if (d) d();
}

function advanceTalk() {
  if (!TALK.open || TALK.choosing) return;
  if (TALK.typing) finishType(); else nextLine();
}

/* 테스트·빨리감기용. 선택지가 나오면 거기서 멈춘다. */
function skipTalk() {
  let guard = 0;
  while (TALK.open && !TALK.choosing && guard++ < 600) advanceTalk();
  return TALK.choosing ? "choice" : "closed";
}

/* =========================================================================
   18. 그리기
   ========================================================================= */

let ctx = null;
try { ctx = $("map").getContext("2d"); } catch (e) { ctx = null; }
if (ctx) { ctx.imageSmoothingEnabled = false; ctx.setTransform(SC, 0, 0, SC, 0, 0); }

function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) >>> 0;
}

function drawSprite(c, rows, pal, px, py) {
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === "." || ch === " ") continue;
      const col = pal[ch];
      if (!col) continue;
      c.fillStyle = col;
      c.fillRect(px + x, py + y, 1, 1);
    }
  }
}

function drawTile(t, px, py, gx, gy) {
  const T = T_(t), h = hash(gx, gy);
  const base = { grass: "#3f6b3a", tree: "#3f6b3a", mtn: "#4a4f5c", water: "#204a78",
                 wall: "#33384a", bridge: "#6b4f30", house: "#3f6b3a", shrine: "#5a5f52",
                 floor: "#4a4c58", throne: "#3a2f4c" }[T.kind] || "#3f6b3a";
  ctx.fillStyle = base; ctx.fillRect(px, py, TS, TS);
  ctx.fillStyle = "rgba(255,255,255,.05)";
  for (let i = 0; i < 5; i++) ctx.fillRect(px + ((h >> (i * 3)) & 15), py + ((h >> (i * 3 + 4)) & 15), 1, 1);

  if (T.kind === "tree") {
    ctx.fillStyle = "#4a2f1d"; ctx.fillRect(px + 7, py + 10, 2, 5);
    ctx.fillStyle = "#1e3c22"; ctx.fillRect(px + 3, py + 2, 10, 9);
    ctx.fillStyle = "#2d5c33"; ctx.fillRect(px + 4, py + 3, 8, 7);
    ctx.fillStyle = "#3d7742"; ctx.fillRect(px + 5, py + 4, 4, 3);
  } else if (T.kind === "mtn") {
    ctx.fillStyle = "#6b7080";
    for (let i = 0; i < 7; i++) ctx.fillRect(px + 7 - i, py + 4 + i, 2 + i * 2, 1);
    ctx.fillStyle = "#c8cede"; ctx.fillRect(px + 7, py + 4, 2, 2); ctx.fillRect(px + 6, py + 6, 4, 1);
    ctx.fillStyle = "#3a3f4c"; ctx.fillRect(px + 1, py + 11, 14, 1);
  } else if (T.kind === "water") {
    ctx.fillStyle = "#2b6094"; ctx.fillRect(px, py + 4, TS, 3); ctx.fillRect(px, py + 11, TS, 2);
    ctx.fillStyle = "#4d8fc4"; ctx.fillRect(px + 2, py + 2, 5, 1); ctx.fillRect(px + 9, py + 8, 5, 1);
  } else if (T.kind === "wall") {
    ctx.fillStyle = "#232735"; ctx.fillRect(px, py, TS, 1); ctx.fillRect(px, py, 1, TS);
    ctx.fillStyle = "#454b60";
    ctx.fillRect(px + 1, py + 1, 6, 6); ctx.fillRect(px + 9, py + 1, 6, 6);
    ctx.fillRect(px + 1, py + 9, 6, 6); ctx.fillRect(px + 9, py + 9, 6, 6);
  } else if (T.kind === "bridge") {
    ctx.fillStyle = "#8a6840"; ctx.fillRect(px, py + 2, TS, 12);
    ctx.fillStyle = "#5a3f22";
    for (let i = 0; i < 4; i++) ctx.fillRect(px + i * 4 + 1, py + 2, 1, 12);
    ctx.fillRect(px, py + 2, TS, 1); ctx.fillRect(px, py + 13, TS, 1);
  } else if (T.kind === "house") {
    ctx.fillStyle = "#c8a878"; ctx.fillRect(px + 3, py + 8, 10, 7);
    ctx.fillStyle = "#8a3f30";
    for (let i = 0; i < 5; i++) ctx.fillRect(px + 7 - i, py + 3 + i, 2 + i * 2, 1);
    ctx.fillStyle = "#4a2f1d"; ctx.fillRect(px + 7, py + 11, 3, 4);
    ctx.fillStyle = "#2a2015"; ctx.fillRect(px + 3, py + 8, 10, 1);
  } else if (T.kind === "shrine") {
    ctx.fillStyle = "#8a8f80"; ctx.fillRect(px + 2, py + 12, 12, 3);
    ctx.fillStyle = "#d8dcc8"; ctx.fillRect(px + 4, py + 4, 3, 8); ctx.fillRect(px + 9, py + 4, 3, 8);
    ctx.fillRect(px + 3, py + 2, 10, 2);
    ctx.fillStyle = "#f0d489"; ctx.fillRect(px + 7, py + 6, 2, 4); ctx.fillRect(px + 6, py + 7, 4, 2);
  } else if (T.kind === "floor") {
    ctx.fillStyle = "#3a3c46"; ctx.fillRect(px, py + 7, TS, 1); ctx.fillRect(px + 7, py, 1, TS);
    ctx.fillStyle = "#565964"; ctx.fillRect(px + 1, py + 1, 5, 5); ctx.fillRect(px + 9, py + 9, 5, 5);
  } else if (T.kind === "throne") {
    ctx.fillStyle = "#5a4070"; ctx.fillRect(px + 3, py + 2, 10, 12);
    ctx.fillStyle = "#d8b45a"; ctx.fillRect(px + 3, py + 2, 10, 2); ctx.fillRect(px + 3, py + 12, 10, 2);
    ctx.fillStyle = "#8a3050"; ctx.fillRect(px + 5, py + 5, 6, 6);
  }
}

function drawHpBar(u, px, py) {
  const w = 14, f = Math.max(0, Math.round(w * u.hp / u.maxhp));
  ctx.fillStyle = "#0b0d14"; ctx.fillRect(px + 1, py + TS - 3, w, 3);
  const r = u.hp / u.maxhp;
  ctx.fillStyle = r > .5 ? "#5ec97a" : r > .25 ? "#d8b45a" : "#e0616a";
  ctx.fillRect(px + 1, py + TS - 3, f, 2);
}

function render() {
  if (!ctx) return;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) drawTile(tileAt(x, y), x * TS, y * TS, x, y);

  if (G.atkSet) { ctx.fillStyle = "rgba(224,97,106,.30)"; G.atkSet.forEach(k => ctx.fillRect((k % W) * TS, ((k / W) | 0) * TS, TS, TS)); }
  if (G.moveSet) { ctx.fillStyle = "rgba(111,176,240,.34)"; G.moveSet.forEach(k => ctx.fillRect((k % W) * TS, ((k / W) | 0) * TS, TS, TS)); }
  if (G.pending) { ctx.fillStyle = "rgba(240,80,90,.55)"; G.pending.targets.forEach(t => ctx.fillRect(t.x * TS, t.y * TS, TS, TS)); }

  G.units.forEach(u => {
    if (!u.alive) return;
    const px = u.x * TS, py = u.y * TS;
    ctx.fillStyle = u.side === "ally" ? "#6fb0f0" : u.side === "npc" ? "#7ddc9a" : "#e0616a";
    ctx.globalAlpha = .55; ctx.fillRect(px + 2, py + 13, 12, 2); ctx.globalAlpha = 1;
    if (u.acted && u.side !== "foe") ctx.globalAlpha = .5;
    drawSprite(ctx, SPR[u.spr], P[u.pal] || P.goblin, px, py);
    ctx.globalAlpha = 1;
    if (u.boss) { ctx.fillStyle = "#f0d489"; ctx.fillRect(px + 6, py - 1, 4, 2); }
    if (u.evil) { ctx.fillStyle = "#ff5560"; ctx.fillRect(px + 1, py + 1, 2, 2); }
    drawHpBar(u, px, py);
  });

  if (G.sel && G.sel.alive) {
    ctx.strokeStyle = "#f0d489"; ctx.lineWidth = 1;
    ctx.strokeRect(G.sel.x * TS + .5, G.sel.y * TS + .5, TS - 1, TS - 1);
  }
}

function drawFace(cv, id) {
  let c = null;
  try { c = cv.getContext("2d"); } catch (e) { return; }
  if (!c) return;
  c.imageSmoothingEnabled = false;
  c.setTransform(4, 0, 0, 4, 0, 0);
  c.fillStyle = "#0d1017"; c.fillRect(0, 0, 16, 16);
  const cast = CAST[id]; if (!cast) return;
  drawSprite(c, FACE[cast.face] || FACE.short, FP[cast.fpal] || FP.arden, 0, 0);
}

function drawUnitIcon(cv, id) {
  let c = null;
  try { c = cv.getContext("2d"); } catch (e) { return; }
  if (!c) return;
  c.imageSmoothingEnabled = false;
  const s = cv.width / 16;
  c.setTransform(s, 0, 0, s, 0, 0);
  c.clearRect(0, 0, 16, 16);
  const cast = CAST[id]; if (!cast) return;
  drawSprite(c, SPR[CLASSES[cast.cls].spr], P[cast.pal], 0, 0);
}

function show(id) {
  ["title", "chapters", "battle", "result", "memoir"].forEach(s => {
    const el = $(s); if (el) el.classList.toggle("on", s === id);
  });
  try { window.scrollTo(0, 0); } catch (e) {}
}

function openChapters() {
  show("chapters");
  const list = $("chlist"); list.innerHTML = "";
  let act = null;
  CHAPTERS.forEach((ch, i) => {
    if (ch.act !== act) {
      act = ch.act;
      const h = document.createElement("div"); h.className = "actlabel"; h.textContent = act;
      list.appendChild(h);
      const g = document.createElement("div"); g.className = "chlist"; g.dataset.act = act;
      list.appendChild(g);
    }
    const locked = i > SAVE.cleared, done = i < SAVE.cleared;
    const b = document.createElement("button");
    b.className = "chcard" + (locked ? " locked" : "") + (done ? " done" : "");
    b.dataset.ch = i;
    b.innerHTML = '<div class="chnum">' + ch.id + '</div><div class="chbody"><h3>' +
      (locked ? "???" : ch.title + " — " + ch.sub) + '</h3><p>' +
      (locked ? "앞 장을 끝내야 열린다." : ch.blurb) + (done ? " · 완료" : "") + '</p></div>';
    if (!locked) b.onclick = () => startChapter(i);
    list.lastChild.appendChild(b);
  });

  const party = $("party"); party.innerHTML = "";
  PARTY_ORDER.forEach(id => {
    if (JOIN_AT[id] > SAVE.cleared) return;
    const r = G.roster[id] || { lv: 1 };
    const d = document.createElement("div"); d.className = "pcard";
    const cv = document.createElement("canvas"); cv.width = 32; cv.height = 32;
    d.appendChild(cv);
    const box = document.createElement("div");
    box.innerHTML = '<div class="pn">' + CAST[id].name + ' · Lv ' + (r.lv || 1) + '</div><div class="pl">' +
      CLASSES[CAST[id].cls].n + ' · ' + CAST[id].note + '</div>';
    d.appendChild(box); party.appendChild(d);
    drawUnitIcon(cv, id);
  });
}

let memoBack = "title";
function openMemoir(from) {
  memoBack = from || "title";
  show("memoir");
  const ep = $("epList"); ep.innerHTML = "";
  EPILOGUES.forEach(e => {
    const got = SAVE.epilogues.indexOf(e.flag) >= 0;
    const d = document.createElement("div");
    d.className = "mi" + (got ? "" : " locked");
    d.innerHTML = got ? "<p>" + e.t + "</p>" : "<p>??? — 아직 이 선택을 하지 않았다.</p>";
    ep.appendChild(d);
  });
  const sp = $("spList"); sp.innerHTML = "";
  SUPPORTS.forEach(s => {
    const got = SAVE.supports.indexOf(s.key) >= 0;
    const d = document.createElement("div");
    d.className = "mi" + (got ? "" : " locked");
    d.innerHTML = got
      ? "<h5>" + CAST[s.a].name + " · " + CAST[s.b].name + " — 「" + s.title + "」</h5>" +
        s.lines.map(l => "<p>" + (l.w ? "<b style='color:" + CAST[l.w].color + "'>" + CAST[l.w].name + "</b> " : "") + (l.t || l.n) + "</p>").join("")
      : "<h5>" + CAST[s.a].name + " · " + CAST[s.b].name + "</h5><p>전투 중 두 사람을 나란히 세우면 열린다.</p>";
    sp.appendChild(d);
  });
}

function refreshSaveNote() {
  const n = $("saveNote");
  $("btnCont").disabled = SAVE.cleared <= 0;
  if (SAVE.cleared_run) {
    n.textContent = "원정을 마쳤다. 모은 후일담 " + SAVE.epilogues.length + "/" + EPILOGUES.length +
      " · 일행의 대화 " + SAVE.supports.length + "/" + SUPPORTS.length;
  } else if (SAVE.cleared > 0) {
    n.textContent = SAVE.cleared + "장까지 진행했다. (전체 " + CHAPTERS.length + "장)";
  } else n.textContent = "";
}

/* =========================================================================
   21. 이벤트 연결
   ========================================================================= */

$("btnNew").onclick = () => {
  G.flags = new Set(); G.roster = {}; G.fell = new Set();
  SAVE.cleared = 0; SAVE.flags = []; SAVE.roster = {}; SAVE.effects = []; SAVE.cleared_run = false;
  writeSave();
  openChapters();
};
$("btnCont").onclick = () => {
  G.flags = new Set(SAVE.flags || []);
  G.roster = SAVE.roster || {};
  openChapters();
};
$("btnMemo").onclick = () => openMemoir("title");
$("btnMemoBack").onclick = () => show(memoBack);
$("btnToTitle").onclick = () => { refreshSaveNote(); show("title"); };
$("btnEnd").onclick = () => endTurn();
$("btnGiveUp").onclick = () => { if (!G.over) { G.over = true; showResult(false, "후퇴했다."); } };

$("map").addEventListener("click", ev => {
  const r = ev.currentTarget.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / (r.width / W));
  const y = Math.floor((ev.clientY - r.top) / (r.height / H));
  if (inBounds(x, y)) onTile(x, y);
});

$("talk").addEventListener("click", ev => {
  if (ev.target.closest && ev.target.closest(".copt")) return;
  advanceTalk();
});

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(o => o.classList.toggle("on", o === t));
    $("tpEp").classList.toggle("on", t.dataset.t === "ep");
    $("tpSp").classList.toggle("on", t.dataset.t === "sp");
  };
});

document.addEventListener("keydown", e => {
  if (TALK.open && (e.key === " " || e.key === "Enter")) { e.preventDefault(); advanceTalk(); }
});

refreshSaveNote();
</script>
</body>
</html>
